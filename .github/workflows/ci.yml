---
name: CI
'on':
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out the codebase.
        uses: actions/checkout@v4

      - name: Set up Python 3.
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install lint dependencies.
        run: pip3 install yamllint ansible ansible-lint

      # ansible-lint has to resolve the roles/collections main.yml references
      # (installed to ./roles per ansible.cfg; .yamllint/.ansible-lint ignore it).
      - name: Install required roles and collections.
        run: ansible-galaxy install -r requirements.yml

      - name: Lint code.
        run: |
          yamllint .
          ansible-lint

  test:
    name: Test (bats on macOS)
    # The helper scripts and task files target macOS (plutil, osascript, brew
    # paths), so the bats suite runs on a macOS runner, not Ubuntu.
    runs-on: macos-latest
    steps:
      - name: Check out the codebase.
        uses: actions/checkout@v4

      - name: Set up Python 3.
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install test dependencies.
        run: |
          brew install bats-core
          pip3 install yamllint ansible ansible-lint
          ansible-galaxy install -r requirements.yml

      - name: Syntax-check the playbook.
        run: ansible-playbook main.yml --syntax-check

      - name: Run the bats suite.
        run: bats tests/

  # Runs the WHOLE playbook on a fresh macOS runner. It sat queued forever on
  # the retired macos-11/12 runners, and on this fork it also needs the private
  # dotfiles repo over SSH, so it is manual-only (Actions tab -> Run workflow)
  # until tests/config.yml turns off everything a runner can't do.
  integration:
    name: Integration
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-15
    steps:
      - name: Check out the codebase.
        uses: actions/checkout@v4

      - name: Uninstall GitHub Actions' built-in Homebrew.
        run: tests/uninstall-homebrew.sh

      - name: Uninstall GitHub Actions' built-in browser installs.
        run: |
          sudo rm -rf /Applications/Firefox.app
          sudo rm -rf /Applications/Google\ Chrome.app

      - name: Set up Python 3.
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install test dependencies.
        run: pip3 install ansible

      - name: Set up the test environment.
        run: |
          cp tests/ansible.cfg ./ansible.cfg
          cp tests/inventory ./inventory
          cp tests/config.yml ./config.yml
          ansible-galaxy install -r requirements.yml

      - name: Test the playbook's syntax.
        run: ansible-playbook main.yml --syntax-check

      - name: Test the playbook.
        run: ansible-playbook main.yml
        env:
          ANSIBLE_FORCE_COLOR: '1'

      - name: Idempotence check.
        run: |
          idempotence=$(mktemp)
          ansible-playbook main.yml | tee -a ${idempotence}
          tail ${idempotence} | grep -q 'changed=0.*failed=0' && (echo 'Idempotence test: pass' && exit 0) || (echo 'Idempotence test: fail' && exit 1)
        env:
          ANSIBLE_FORCE_COLOR: '1'
