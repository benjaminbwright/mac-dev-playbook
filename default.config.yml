---
downloads: ~/.ansible-downloads/

configure_dotfiles: true
configure_terminal: true
configure_osx: true

# Set to 'true' to configure the Dock via dockutil.
configure_dock: true
dockitems_remove:
  - Launchpad
  - TV
  - Podcasts
  - "App Store"
  - News
  - Mail
  - Contacts
  - Maps
  - Music
  - FaceTime
  - Messages
  - Photos
  - Safari
# Captured from the current Mac's Dock (in order). Note: the dock role only adds
# and positions these; the Downloads stack on the right is a default and stays.
dockitems_persist:
  - name: "Terminal"
    path: "/System/Applications/Utilities/Terminal.app/"
    pos: 1
  - name: "Visual Studio Code"
    path: "/Applications/Visual Studio Code.app/"
    pos: 2
  - name: "Cursor"
    path: "/Applications/Cursor.app/"
    pos: 3
  - name: "Obsidian"
    path: "/Applications/Obsidian.app/"
    pos: 4
  - name: "Google Chrome"
    path: "/Applications/Google Chrome.app/"
    pos: 5
  - name: "Microsoft Edge"
    path: "/Applications/Microsoft Edge.app/"
    pos: 6
  - name: "Calendar"
    path: "/System/Applications/Calendar.app/"
    pos: 7
  - name: "Fantastical"
    path: "/Applications/Fantastical.app/"
    pos: 8
  - name: "Reminders"
    path: "/System/Applications/Reminders.app/"
    pos: 9
  - name: "System Settings"
    path: "/System/Applications/System Settings.app/"
    pos: 10
  - name: "Notes"
    path: "/System/Applications/Notes.app/"
    pos: 11
  - name: "Freeform"
    path: "/System/Applications/Freeform.app/"
    pos: 12
  - name: "Feedback Assistant"
    path: "/System/Library/CoreServices/Applications/Feedback Assistant.app/"
    pos: 13

configure_sudoers: false
sudoers_custom_config: ""
# Example:
# sudoers_custom_config: |
#   # Allow users in admin group to use sudo with no password.
#   %admin ALL=(ALL) NOPASSWD: ALL

dotfiles_repo: git@github.com:benjaminbwright/dotfiles.git
dotfiles_repo_version: main
dotfiles_repo_accept_hostkey: true
dotfiles_repo_local_destination: ~/Development/GitHub/dotfiles
# NOTE: this is a PRIVATE repo cloned over SSH, so the new Mac must have GitHub
# SSH access before the dotfiles step runs (see NEW-MAC.md). Secrets are NOT in
# the repo — machine-local values live in ~/.zshrc.local (see .zshrc.local.example).
dotfiles_files:
  - .zshrc
  - .aliases
  - .gitconfig
  - .gitignore
  - .inputrc
  - .vimrc
  - .osx
  - .zshenv

homebrew_installed_packages:
  # - ansible # Installed via Pip.
  - autoconf
  - bash-completion
  - doxygen
  - gettext
  - gifsicle
  - git
  - github/gh/gh
  - go
  - gpg
  - httpie
  - iperf
  - libevent
  - sqlite
  - mysql
  # mcrypt removed: dropped from Homebrew (legacy lib; PHP removed mcrypt in 7.2),
  # so a fresh Mac errors with "No available formula with the name mcrypt".
  - mongodb-community
  - nmap
  - node
  - nvm
  - php
  - poetry
  - python
  - ssh-copy-id
  - cowsay
  - readline
  - rustup
  - openssl
  - pv
  - wget
  - wrk
  - zsh-history-substring-search
  - cocoapods
  - pandoc
  - pnpm
  - mysql-client
  # --- Added to mirror current machine (2026-06-16) ---
  # Languages / runtimes / version management
  - pyenv
  - virtualenv
  - python@3.10
  - python@3.11
  - yarn
  - gcc
  # Cloud / infra / kubernetes
  - hashicorp/tap/terraform
  - helm
  - minikube
  - kubeconform
  - golang-migrate
  - doctl
  - railway
  - docker-compose
  # Dev tooling
  - bufbuild/buf/buf
  - xcodegen
  - direnv
  - fswatch
  - rsync
  - graphviz
  - black
  - ruff
  - bats-core
  - pi-coding-agent
  # Was the `limbo` vendor install in ~/.limbo (issue #10); Homebrew renamed the
  # formula limbo -> turso and the binary is now `tursodb`.
  - turso
  # Databases
  - postgresql@14
  # File sync (continuous sync to the local Syncthing server; runs as a brew
  # service, configured via the web UI at http://localhost:8384)
  - syncthing
  # Media / misc
  - ffmpeg
  - weasyprint
  - cmatrix
  # Mac App Store CLI (used by mas_installed_apps below)
  - mas
  # Ansible itself — so it's durably installed at /opt/homebrew/bin (on PATH for
  # make, cron, bare shells, etc.). You still need Ansible present to run this
  # playbook the first time; bootstrap with `brew install ansible` (see NEW-MAC.md),
  # and this keeps it installed thereafter.
  - ansible
  # --- Added to mirror current machine (2026-09-10, issue #5) ---
  # Web server / reverse proxy
  - caddy
  # MongoDB shell (companion to mongodb-community above)
  - mongosh
  # Pinned legacy Node for older projects (nvm also available)
  - node@16
  # Isolated installs of Python CLI tools
  - pipx
  # Roku CLI (tap: grahamplata/tap)
  - grahamplata/tap/roku-remote

homebrew_taps:
  # homebrew/core and homebrew/cask are built into Homebrew now — tapping them
  # explicitly errors ("Tapping homebrew/core is no longer typically necessary"),
  # so they are intentionally omitted.
  - mongodb/brew
  - hashicorp/tap
  - bufbuild/buf
  - grahamplata/tap  # roku-remote
  # Present on the current machine but not currently backing a declared package:
  # - heroku/brew
  # - hpedrorodrigues/tools

homebrew_cask_appdir: /Applications
homebrew_cask_apps:
  - chromedriver
  # Container runtime: docker CLI + Docker Desktop (orbstack intentionally omitted).
  # 'docker' cask was renamed upstream to 'docker-desktop'.
  - docker-desktop
  - dropbox
  - firefox
  - google-chrome
  - handbrake
  - handbrake-app
  - licecap
  - sequel-ace
  - slack
  - transmit
  - visual-studio-code
  - obsidian
  - zoom
  # NOTE: the 'mysql-connector-python' cask was removed from Homebrew (deprecated
  # ~2023), so `brew install --cask mysql-connector-python` fails with "No Cask
  # with this name exists". It's a Python library — install it per-project via
  # poetry/pip in a virtualenv (e.g. `pip install mysql-connector-python`), or add
  # it to pip_packages if you really want it global.
  - fantastical
  - freecad
  - balenaetcher
  # --- Added to mirror current machine (2026-06-16) ---
  # Editors / AI / terminal
  - cursor
  - claude
  - claude-code
  # Installer-based CLIs that Homebrew now packages (issue #10). On the old Mac
  # these were vendor installs in ~/.local/bin; the casks put the same binaries
  # on PATH via /opt/homebrew/bin. `cursor-cli` ships the `cursor-agent` binary.
  - codex
  - cursor-cli
  - warp
  - wispr-flow
  - chatgpt
  # Dev / DB / API tooling
  # NOTE: dockutil is NOT a cask (it's a formula) and the geerlingguy.mac.dock
  # role already installs it via Homebrew when dockutil_install is true (default).
  # Listing it as a cask fails with "No Cask with this name exists" — removed.
  - insomnia
  - pgadmin4
  # Productivity / comms
  - figma
  - asana
  - microsoft-teams
  - microsoft-edge
  - google-drive
  - tailscale
  - logseq
  # Design / CAD / print / media
  - inkscape
  - inkstitch
  - scribus
  - scrivener
  - openoffice
  - topaz-gigapixel-ai
  - vassal
  # --- Added to mirror current machine (2026-09-10, issue #5) ---
  # Email
  - thunderbird
  # Roku remote GUI (CLI counterpart: roku-remote formula above)
  - roku-remote-tool
  # NOTE: orbstack is installed alongside Docker Desktop but stays intentionally
  # omitted pending the Docker Desktop vs OrbStack decision (issue #5).

# ---------------------------------------------------------------------------
# MANUAL INSTALLS — NOT managed by this playbook.
# These apps are not available via Homebrew cask or the Mac App Store (or are
# managed by their own installer). After running the playbook on a new Mac,
# install these by hand so nothing is forgotten. Captured 2026-06-16.
#
# When auditing the old Mac, check ~/Applications as well as /Applications:
# some installers (e.g. Autodesk Fusion) put their apps there instead.
#
# Adobe Creative Cloud (install the CC desktop app first, then each app):
#   - Adobe Creative Cloud .... https://creativecloud.adobe.com/apps/download/creative-cloud
#   - Acrobat DC
#   - Audition
#   - Illustrator
#   - Photoshop 2024 and Photoshop 2025 (both are installed; keep both)
#   - Premiere Pro
#   - Media Encoder
#
# Other direct-download / unverified-source apps:
#   - Codex ................... https://persistent.oaistatic.com/sidekick/public/ChatGPT.dmg
#   - Join .................... https://joaoapps.com/join/
#   - GoodMorning ............. (verify source / vendor)
#   - BookWright .............. Blurb book-design tool: https://www.blurb.com/bookwright
#   - Victory Shield .......... (verify source / vendor)
#   - Autodesk Fusion ......... https://www.autodesk.com/products/fusion-360/ (installs to ~/Applications)
#   - Steam ................... https://store.steampowered.com/about/
#   - SkillVault Desktop ...... (verify source / vendor)
#   - ChatGPT Classic ......... separate app from the `chatgpt` cask; install from https://chatgpt.com/
#   - Google Docs ............. Chrome PWA; re-install from Chrome (open docs.google.com > Install app)
#   - Google Sheets ........... Chrome PWA; re-install from Chrome (open sheets.google.com > Install app)
#   - Google Slides ........... Chrome PWA; re-install from Chrome (open slides.google.com > Install app)
# ---------------------------------------------------------------------------

homebrew_cask_uninstalled_apps:
  - sublime-text

# See `geerlingguy.mas` role documentation for usage instructions.
# Captured from `mas list` on the current machine (2026-06-16).
# You must be signed into the App Store on the new Mac for these to install.
mas_installed_apps:
  - id: 497799835
    name: "Xcode"
  - id: 634148309
    name: "Logic Pro"
  - id: 634159523
    name: "MainStage"
  - id: 682658836
    name: "GarageBand"
  - id: 899247664
    name: "TestFlight"
  - id: 585829637
    name: "Todoist"
  - id: 1298450641
    name: "monday.com"
  - id: 1667260533
    name: "Sketch"
  - id: 6469834197
    name: "Roam"
  - id: 6714467650
    name: "Perplexity"
mas_email: ""
mas_password: ""

osx_script: "~/.osx --no-restart"

# Install packages from other package managers.
# Note: You are responsible for making sure the required package managers are
# installed, eg. through homebrew.
composer_packages: []
# - name: drush
#   state: present # present/absent, default: present
#   version: "^8.1" # default: N/A
gem_packages: []
# - name: bundler
#   state: present # present/absent/latest, default: present
#   version: "~> 1.15.1" # default: N/A
npm_packages: []
# - name: webpack
#   state: present # present/absent/latest, default: present
#   version: "^2.6" # default: N/A
pip_packages: []
# - name: mkdocs
#   state: present # present/absent/latest, default: present
#   version: "0.16.3" # default: N/A

# Set to 'true' to configure Sublime Text.
configure_sublime: false
sublime_base_path: "~/Library/Application Support/Sublime Text"
sublime_config_path: "Packages/User"
sublime_package_control:
  - "DocBlockr"
  - "Dockerfile Syntax Highlighting"
  - "FileDiffs"
  - "GitHub Flavored Markdown Preview"
  - "Jinja2"
  - "Package Control"
  - "PHP-Twig"
  - "Pretty JSON"
  - "SublimeLinter"
  - "SublimeLinter-contrib-yamllint"
  - "TrailingSpaces"
  - "WordCount"

# Glob pattern to ansible task files to run after all other tasks are finished.
post_provision_tasks: []

# Mysql role vars
mysql_packages:
  - mysql
  - mysql-server

# Local database dump/restore (scripts/db-dump.sh + scripts/db-restore.sh).
# db_dump_dir: where `ansible-playbook main.yml --tags db-restore` looks for a
#   dump made on the old Mac. db-dump.sh writes ~/Development/db-dumps/<date>/
#   and keeps a relative 'latest' symlink next to it, so copying the whole
#   db-dumps dir across makes this default just work.
# db_docker_volumes: Docker named volumes to archive/restore. Empty = none.
db_dump_dir: ~/Development/db-dumps/latest
db_docker_volumes: []

# Services, LaunchAgents and login items (tasks/services.yml, --tags services)
# Homebrew services to `brew services start` (idempotent; starts them as login
# services). Only what the old Mac actually ran. postgresql@14 and caddy are
# installed but deliberately NOT started - add them here to opt in.
homebrew_services_started:
  - mysql
  - mongodb-community
  - syncthing
# Opt-in: install ~/Library/LaunchAgents/com.active-git.plist (hourly run of the
# `active-git` npm tool) from templates/, using the stable /opt/homebrew/bin/node
# path. The old Mac's copy pointed at a Cellar path for a node that no longer
# exists, so it was already dead there; off by default until the tool is wanted.
configure_active_git_agent: false
# Login items to add via System Events (only apps with a stable /Applications
# path; helpers like FigmaAgent and Acrobat's synchronizer register themselves
# when their parent app first runs). Items whose path is missing are skipped.
login_items:
  - name: Dropbox
    path: /Applications/Dropbox.app
  - name: Google Drive
    path: /Applications/Google Drive.app
  - name: Claude
    path: /Applications/Claude.app

# python
# Do NOT hardcode /opt/homebrew/bin/python3 here: on a fresh Mac that path does
# not exist until the homebrew role runs, but fact-gathering happens first, so
# the playbook fails at "Gathering Facts" with "no such file or directory".
# 'auto_silent' lets Ansible discover a Python that already exists (and silences
# the discovery warning). Override in config.yml if you need a specific one.
ansible_python_interpreter: auto_silent
